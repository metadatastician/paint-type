# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: CodeQL Security Analysis
# Trigger is workflow_dispatch ONLY, deliberately.
# Org-level code-scanning config 256896 sets allow_advanced: false, so SARIF from
# this advanced workflow is REFUSED ("analyses from advanced configurations cannot
# be processed when the default setup is enabled"). Default-setup CodeQL runs
# separately, is green, and satisfies the code_scanning ruleset rule.
# The file is retained because .github/workflows/actions.lock keys an entry to it;
# deleting it would orphan that entry. Restore push/pull_request only if the org
# re-enables advanced setup.
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default to `actions` — scaffolded repos rarely have JS/TS
          # source; `javascript-typescript` produced "no source files"
          # failures on every CodeQL run. The `actions` extractor scans
          # workflow files which every repo has. Override per-repo if
          # the scaffolded project actually contains JS/TS code.
          # Per hypatia rule `codeql_language_matrix_mismatch`.
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        # HOLD: pinned to the v4.38.0 SHA. v4.38.1 (1c5b675) is rejected by
        # GitHub's workflow-startup validation estate-wide — every run dies at
        # startup with zero jobs. Do not bump until upstream clears 4.38.1
        # (hyperpolymath/nexia-list#100, hyperpolymath/standards#973/#978);
        # the dependabot hold in .github/dependabot.yml enforces this.
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
