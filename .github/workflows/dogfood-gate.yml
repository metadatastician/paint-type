# SPDX-License-Identifier: AGPL-3.0-or-later
# Dogfood Gate — exercises canonical hyperpolymath DEED, K9, and protocol lanes
# across paint-type on every PR and push.
#
# Matrix 1 (`k9-deed` conformance + K9 verdict grid):
#   1. DEED conformance (`hyperpolymath/standards/.github/workflows/deed-conformance.yml`)
#   2. K9 L0-L2 conformance + K9 verdict grid (`k9-conformance.yml` -> `k9-verdict` sticky PR comment)
#   3. K9 coordination grammar check (`scripts/validate-coordination-k9.js` via Bun against `coordination-k9-grammar_v1.2.abnf`)
#   4. Shields endpoint publishing (`badges/deed.json` + `badges/k9.json` on `governance-badges`)
#   5. Invisible-character lint (`empty-lint`)
#   6. Groove discovery surface check (`/.well-known/groove`)
#   7. eclexiaiser carbon-budget validation (`eclexiaiser.toml`)
#   8. Canon lockstep check (`paint-type_chora.deed` vs `hyperpolymath/standards/canon.lock`)
#   9. 6/6 Dogfooding Scorecard summary (`dogfood-summary`)

name: Dogfood Gate

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dogfood-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. DEED Conformance — canonical grammar & linter from hyperpolymath/standards
  # ───────────────────────────────────────────────────────────────────────────
  deed-validate:
    name: DEED Conformance
    uses: hyperpolymath/standards/.github/workflows/deed-conformance.yml@01c9b0c9f2646ebea0b30a9588462642ac94aee9
    with:
      require-files: true

  # ───────────────────────────────────────────────────────────────────────────
  # 2. K9 Conformance — L0 envelope + L1 structural + L2 Nickel v1.0.0 + grid
  # ───────────────────────────────────────────────────────────────────────────
  k9-validate:
    name: K9 Conformance
    permissions:
      contents: read
      pull-requests: read
    uses: hyperpolymath/standards/.github/workflows/k9-conformance.yml@01c9b0c9f2646ebea0b30a9588462642ac94aee9
    with:
      require-files: true

  # Sticky K9 Conformance Verdict Grid comment on PRs (fork-safe post-job)
  k9-verdict:
    name: K9 Verdict Grid
    needs: k9-validate
    if: ${{ always() && github.event_name == 'pull_request' && needs.k9-validate.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download K9 verdict grid artifact
        id: grid
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: k9-grid
          path: grid

      - name: Post or update sticky K9 verdict grid comment
        if: steps.grid.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -s grid/report.md || exit 0
          marker='<!-- verdict-grid:k9 regenerated on every run -->'
          existing=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.type == "Bot" and (.body | contains("'"$marker"'"))) | .id' \
            | head -n1 || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@grid/report.md >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@grid/report.md >/dev/null
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 3. K9 Coordination Nerve Receptor — ABNF v1.2.0 grammar check (Bun)
  # ───────────────────────────────────────────────────────────────────────────
  k9-coordination-validate:
    name: K9 Coordination Grammar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.21"

      - name: Validate coordination.k9 against coordination-k9-grammar_v1.2.abnf
        run: |
          set -euo pipefail
          bun scripts/validate-coordination-k9.js coordination.k9
          {
            echo "### K9 Coordination Nerve Receptor"
            echo ""
            echo "| File | Grammar | Runtime | Status |"
            echo "|------|---------|---------|--------|"
            echo "| \`coordination.k9\` | \`coordination-k9-grammar_v1.2.abnf\` | \`bun $(bun --version)\` | PASS |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # 4. Badges — publish badges/deed.json + badges/k9.json on governance-badges
  # ───────────────────────────────────────────────────────────────────────────
  badges:
    name: Conformance Badges
    needs: [deed-validate, k9-validate]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download K9 verdict grid artifact
        id: k9grid
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: k9-grid
          path: grid

      - name: Publish DEED and K9 shields endpoints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEED_RESULT: ${{ needs.deed-validate.result }}
          K9_RESULT: ${{ needs.k9-validate.result }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          BRANCH=governance-badges

          badge() {
            case "$2" in
              success) printf '{"schemaVersion":1,"label":"%s","message":"passing","color":"brightgreen"}\n' "$1" ;;
              skipped) printf '{"schemaVersion":1,"label":"%s","message":"skipped","color":"lightgrey"}\n' "$1" ;;
              *)       printf '{"schemaVersion":1,"label":"%s","message":"failing","color":"red"}\n' "$1" ;;
            esac
          }

          if ! gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            BLOB=$(printf 'Shields endpoint branch — updated by CI, do not edit.\n' \
              | gh api "repos/$REPO/git/blobs" -F content=@- --jq .sha)
            TREE=$(gh api "repos/$REPO/git/trees" \
              -f 'tree[][path]=README' -f 'tree[][mode]=100644' \
              -f 'tree[][type]=blob' -f "tree[][sha]=$BLOB" --jq .sha)
            COMMIT=$(gh api "repos/$REPO/git/commits" \
              -f message='chore: open badge branch' -f "tree=$TREE" --jq .sha)
            gh api "repos/$REPO/git/refs" -f "ref=refs/heads/$BRANCH" -f "sha=$COMMIT" >/dev/null
          fi

          put() {
            local path="$1" body="$2" cur existing sha
            cur=$(gh api "repos/$REPO/contents/$path?ref=$BRANCH" 2>/dev/null || true)
            existing=$(printf '%s' "$cur" | jq -r '.content // empty' | tr -d '\n' | base64 -d 2>/dev/null || true)
            [ "$existing" = "$body" ] && return 0
            sha=$(printf '%s' "$cur" | jq -r '.sha // empty')
            printf '%s' "$body" | base64 -w0 \
              | jq -Rs --arg m "chore(badges): update $path [skip ci]" --arg b "$BRANCH" --arg s "$sha" \
                  '{message:$m, content:., branch:$b} + (if $s == "" then {} else {sha:$s} end)' \
              | gh api -X PUT "repos/$REPO/contents/$path" --input - >/dev/null
          }

          put badges/deed.json "$(badge 'DEED syntax' "$DEED_RESULT")"
          if [ -s grid/badge.json ]; then
            put badges/k9.json "$(cat grid/badge.json)"
          else
            put badges/k9.json "$(badge 'K9 syntax' "$K9_RESULT")"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 5. Empty-Linter — Invisible & control character clean scan
  # ───────────────────────────────────────────────────────────────────────────
  empty-lint:
    name: Empty-Linter (Invisible Characters)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan source files for invisible Unicode & control characters
        run: |
          set -euo pipefail
          FAIL=0
          COUNT=0

          while IFS= read -r -d '' f; do
            case "$f" in
              *.png|*.ico|*.woff2|*.ttf|*.otf|*.wasm|*.ptype|*.a|*.so) continue ;;
            esac
            COUNT=$((COUNT + 1))

            if LC_ALL=C grep -Pn '[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]' "$f" 2>/dev/null; then
              echo "::error file=$f::Control character detected"
              FAIL=$((FAIL + 1))
            fi

            if grep -Pn '[\x{FEFF}\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2066}-\x{2069}]' "$f" 2>/dev/null; then
              echo "::error file=$f::Zero-width, BOM, or bidirectional override character detected"
              FAIL=$((FAIL + 1))
            fi
          done < <(git ls-files -z)

          echo "Scanned $COUNT tracked text files; $FAIL violation(s)."
          test "$FAIL" -eq 0

  # ───────────────────────────────────────────────────────────────────────────
  # 6. Groove Surface Check — /.well-known/groove capability discovery
  # ───────────────────────────────────────────────────────────────────────────
  groove-check:
    name: Groove Surface Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify Groove endpoint & manifest integrity
        run: |
          set -euo pipefail
          FOUND=0
          if [ -f .well-known/groove/manifest.json ]; then
            echo "Found .well-known/groove/manifest.json"
            jq empty .well-known/groove/manifest.json
            FOUND=1
          fi
          if grep -rn "well-known/groove" src/ 2>/dev/null; then
            echo "Found /.well-known/groove handler in src/"
            FOUND=1
          fi
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No Groove endpoint or .well-known/groove/manifest.json found"
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # 7. eclexiaiser Carbon-Budget Validation (pure shell — zero banned runtimes)
  # ───────────────────────────────────────────────────────────────────────────
  eclexiaiser-validate:
    name: eclexiaiser Carbon-Budget Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate eclexiaiser.toml budget manifest
        run: |
          set -euo pipefail
          test -f eclexiaiser.toml || {
            echo "::error::eclexiaiser.toml missing at repository root"
            exit 1
          }
          for section in '\[project\]' '\[budgets\]'; do
            grep -qE "^${section}" eclexiaiser.toml || {
              echo "::error file=eclexiaiser.toml::Missing required TOML table ${section}"
              exit 1
            }
          done
          grep -qE '^[[:space:]]*name[[:space:]]*=' eclexiaiser.toml || {
            echo "::error file=eclexiaiser.toml::Missing project.name entry"
            exit 1
          }
          echo "PASS: eclexiaiser.toml budget tables verified"

  # ───────────────────────────────────────────────────────────────────────────
  # 8. Canon Lockstep — paint-type_chora.deed vs hyperpolymath/standards/canon.lock
  # ───────────────────────────────────────────────────────────────────────────
  canon-lockstep:
    name: Canon Lockstep Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify (canon) clause matches hyperpolymath/standards/canon.lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STANDARDS_PIN="01c9b0c9f2646ebea0b30a9588462642ac94aee9"
          LOCK=$(gh api "repos/hyperpolymath/standards/contents/canon.lock?ref=$STANDARDS_PIN" --jq .content | base64 -d)

          want_version=$(printf '%s\n' "$LOCK" | sed -n '/^\[canon\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)
          want_criteria=$(printf '%s\n' "$LOCK" | sed -n '/^criteria[[:space:]]*=/,/}/s/.*sha256[[:space:]]*=[[:space:]]*"\([0-9a-f]*\)".*/\1/p' | head -n1)
          want_gates=$(printf '%s\n' "$LOCK" | sed -n '/^gates[[:space:]]*=/,/}/s/.*sha256[[:space:]]*=[[:space:]]*"\([0-9a-f]*\)".*/\1/p' | head -n1)

          DEED=$(bash scripts/deed-field.sh --find .)
          FAIL=0
          for pair in "version:$want_version" "criteria-sha256:$want_criteria" "gates-sha256:$want_gates"; do
            k="${pair%:*}"; want="${pair#*:}"
            got=$(bash scripts/deed-field.sh "$DEED" canon "$k" || true)
            if [ -z "$want" ] || [ "$got" != "$want" ]; then
              echo "::error file=$DEED::canon :$k is '$got' (canon.lock at $STANDARDS_PIN has '$want')"
              FAIL=1
            fi
          done
          test "$FAIL" -eq 0
          echo "PASS: $DEED matches canon.lock ($(bash scripts/deed-field.sh "$DEED" canon version))"

  # ───────────────────────────────────────────────────────────────────────────
  # 9. Dogfooding Scorecard Summary (6/6 targets)
  # ───────────────────────────────────────────────────────────────────────────
  dogfood-summary:
    name: Dogfooding Scorecard Summary
    runs-on: ubuntu-latest
    needs:
      - deed-validate
      - k9-validate
      - k9-coordination-validate
      - empty-lint
      - groove-check
      - eclexiaiser-validate
      - canon-lockstep
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate dogfooding scorecard
        env:
          DEED_RES: ${{ needs.deed-validate.result }}
          K9_RES: ${{ needs.k9-validate.result }}
          COORD_RES: ${{ needs.k9-coordination-validate.result }}
          LINT_RES: ${{ needs.empty-lint.result }}
          GROOVE_RES: ${{ needs.groove-check.result }}
          ECLEX_RES: ${{ needs.eclexiaiser-validate.result }}
          CANON_RES: ${{ needs.canon-lockstep.result }}
        run: |
          SCORE=0
          TOTAL=5

          check_present() {
            local label="$1" status="$2"
            if [ "$status" = "present" ]; then
              SCORE=$((SCORE + 1))
              echo "| $label | :white_check_mark: |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $label | $status |" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          echo "## Dogfooding Scorecard" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Format / Surface | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          if find . -maxdepth 4 \( -name '*.k9' -o -name '*.k9.ncl' \) -print -quit 2>/dev/null | grep -q .; then
            check_present "K9 contracts" "present"
          else
            check_present "K9 contracts" ":x:"
          fi

          if [ -f .editorconfig ]; then
            check_present ".editorconfig" "present"
          else
            check_present ".editorconfig" ":x:"
          fi

          if [ -f .well-known/groove/manifest.json ] || grep -rq "well-known/groove" src/ 2>/dev/null; then
            check_present "Groove endpoint" "present"
          else
            check_present "Groove endpoint" ":ballot_box_with_check:"
          fi

          if grep -riq "verisimdb" . 2>/dev/null; then
            check_present "VeriSimDB integration" "present"
          else
            check_present "VeriSimDB integration" ":ballot_box_with_check:"
          fi

          if [ -f eclexiaiser.toml ]; then
            check_present "eclexiaiser" "present"
          else
            check_present "eclexiaiser" ":ballot_box_with_check:"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Score: $SCORE/$TOTAL**" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${DEED_RES:-}" ]; then
            {
              echo ""
              echo "### Matrix 1 Conformance Lanes"
              echo ""
              echo "| Lane | Result |"
              echo "|---|---|"
              echo "| DEED Conformance (\`paint-type_chora.deed\`) | \`$DEED_RES\` |"
              echo "| K9 Conformance Grid (\`*.k9.ncl\` L0-L2) | \`$K9_RES\` |"
              echo "| K9 Coordination Grammar (\`coordination.k9\`) | \`$COORD_RES\` |"
              echo "| Empty-Linter | \`$LINT_RES\` |"
              echo "| Groove Surface Check | \`$GROOVE_RES\` |"
              echo "| eclexiaiser Validation | \`$ECLEX_RES\` |"
              echo "| Canon Lockstep (\`canon.lock\`) | \`$CANON_RES\` |"
            } >> "$GITHUB_STEP_SUMMARY"

            for r in "$DEED_RES" "$K9_RES" "$COORD_RES" "$LINT_RES" "$GROOVE_RES" "$ECLEX_RES" "$CANON_RES"; do
              if [ "$r" != "success" ]; then
                echo "::error::Dogfood Gate failed (upstream result: $r)"
                exit 1
              fi
            done
          fi
