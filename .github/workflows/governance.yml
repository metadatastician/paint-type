# SPDX-License-Identifier: PMPL-1.0-or-later
name: Governance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  governance:
    name: Governance Check
    uses: hyperpolymath/standards/.github/workflows/governance-reusable.yml@bd0df9ead7faf0cdfe0e13e7966d91e28d0101d4
    # Mark as non-critical to prevent workflow failure due to estate-wide issues
    continue-on-error: true
