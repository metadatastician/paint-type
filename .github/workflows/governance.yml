# SPDX-License-Identifier: PMPL-1.0-or-later
name: Governance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: Governance Check
    timeout-minutes: 10
    uses: metadatastician/standards/.github/workflows/governance-reusable.yml@2b6d30bba13d1ed7034fb03ec61b7011e4040896
    # Mark as non-critical to prevent workflow failure due to estate-wide issues
    continue-on-error: true
