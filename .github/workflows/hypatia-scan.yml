# SPDX-License-Identifier: PMPL-1.0-or-later
# Matrix 2 (`hypatia` findings verdict grid):
#   1. `hypatia` calls canonical `hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml`,
#      running Hypatia neurosymbolic scan + `panic-attack assail` + `pons-asinorum`,
#      ingesting `.gitbot-fleet/enrolment.json` + `.gitbot-fleet/report-backs/`,
#      computing revision deltas against the prior PR comment, uploading SARIF,
#      and rendering `verdict-grid/{report.md,badge.json}`.
#   2. `verdict` posts/updates the sticky `<!-- verdict-grid:hypatia regenerated on every run -->`
#      PR comment (fork-safe post-job pattern).
#   3. `badges` publishes `badges/hypatia.json` onto `governance-badges` on pushes to `main`.
name: Hypatia Security Scan

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master, develop]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hypatia-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hypatia:
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@01c9b0c9f2646ebea0b30a9588462642ac94aee9
    permissions:
      actions: read
      contents: read
      security-events: write

  verdict:
    name: Hypatia Verdict Grid
    needs: hypatia
    if: ${{ always() && github.event_name == 'pull_request' && needs.hypatia.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download verdict grid
        id: grid
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verdict-grid
          path: grid

      - name: Post or update sticky Hypatia verdict grid comment
        if: steps.grid.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -s grid/report.md || exit 0
          marker='<!-- verdict-grid:hypatia regenerated on every run -->'
          existing=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.type == "Bot" and (.body | contains("'"$marker"'"))) | .id' \
            | head -n1 || true)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@grid/report.md >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@grid/report.md >/dev/null
          fi

  badges:
    name: Hypatia Badge
    needs: hypatia
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verdict grid
        id: grid
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verdict-grid
          path: grid

      - name: Publish badges/hypatia.json
        if: steps.grid.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s grid/badge.json || exit 0
          REPO="$GITHUB_REPOSITORY"
          BRANCH=governance-badges

          if ! gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            BLOB=$(printf 'Shields endpoint branch — updated by CI, do not edit.\n' \
              | gh api "repos/$REPO/git/blobs" -F content=@- --jq .sha)
            TREE=$(gh api "repos/$REPO/git/trees" \
              -f 'tree[][path]=README' -f 'tree[][mode]=100644' \
              -f 'tree[][type]=blob' -f "tree[][sha]=$BLOB" --jq .sha)
            COMMIT=$(gh api "repos/$REPO/git/commits" \
              -f message='chore: open badge branch' -f "tree=$TREE" --jq .sha)
            gh api "repos/$REPO/git/refs" -f "ref=refs/heads/$BRANCH" -f "sha=$COMMIT" >/dev/null
          fi

          cur=$(gh api "repos/$REPO/contents/badges/hypatia.json?ref=$BRANCH" 2>/dev/null || true)
          body=$(cat grid/badge.json)
          existing=$(printf '%s' "$cur" | jq -r '.content // empty' | tr -d '\n' | base64 -d 2>/dev/null || true)
          [ "$existing" = "$body" ] && exit 0
          sha=$(printf '%s' "$cur" | jq -r '.sha // empty')
          printf '%s' "$body" | base64 -w0 \
            | jq -Rs --arg m "chore(badges): update badges/hypatia.json [skip ci]" --arg b "$BRANCH" --arg s "$sha" \
                '{message:$m, content:., branch:$b} + (if $s == "" then {} else {sha:$s} end)' \
            | gh api -X PUT "repos/$REPO/contents/badges/hypatia.json" --input - >/dev/null
