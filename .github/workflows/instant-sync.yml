# Instant Forge Sync - Triggers propagation to all forges on push/release
name: Instant Sync
on:
  push:
    branches: [main, master]
  release:
    types: [published]

concurrency:
  group: instant-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
jobs:
  dispatch:
    name: Trigger Forge Propagation
    runs-on: ubuntu-latest
    # Skip if dispatch token is not configured
    if: ${{ secrets.FARM_DISPATCH_TOKEN != '' }}
    steps:
      - name: Trigger Propagation
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v3
        with:
          token: ${{ secrets.FARM_DISPATCH_TOKEN }}
          repository: hyperpolymath/.git-private-farm
          event-type: propagate
          client-payload: |-
            {
              "repo": "${{ github.event.repository.name }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "forges": ""
            }
      - name: Confirm
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: echo "::notice::Propagation triggered for ${REPO_NAME}"
