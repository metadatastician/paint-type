#
# Release workflow — triggered by version tags (v*), and dispatchable as a dry run.
# Builds the paint-type host binary with scripts/build-host.sh (the same recipe CI
# uses), packages it with libgossamer, proves the packaged artifact launches, and
# on a tag creates a DRAFT GitHub Release plus SLSA provenance over real digests.
name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      # The tag is the claim; VERSION is the record. A tag that disagrees with
      # VERSION would ship a binary labelled something it is not.
      - name: Assert the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "v${file_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} disagrees with VERSION (v${file_version})"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches VERSION"

      - name: Install build and runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      # Zig by sha256-pinned tarball rather than an action: a `run:` step is
      # invisible to actions.lock, so this adds no lockfile entry. The digest is
      # ziglang.org's own published shasum for 0.15.1.
      - name: Install Zig 0.15.1 (sha256-pinned)
        run: |
          set -euo pipefail
          curl -sSfL -o zig.tar.xz https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz
          echo "c61c5da6edeea14ca51ecd5e4520c6f4189ef5250383db33d01848293bfafe05  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz
          echo "${PWD}/zig-x86_64-linux-0.15.1" >> "$GITHUB_PATH"

      - name: Install Rust (stable, minimal)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # One recipe. host.yml runs this same script, so the release build cannot
      # drift from the build CI proves on every pull request.
      - name: Build the product
        run: bash scripts/build-host.sh

      - name: Package bin/ + lib/
        id: package
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          pkg="paint-type-${version}-x86_64-linux"
          libdir="third_party/gossamer/src/interface/ffi/zig-out/lib"

          mkdir -p "dist/${pkg}/bin" "dist/${pkg}/lib"
          cp src/host/target/release/paint-type "dist/${pkg}/bin/"
          # -a preserves the libgossamer.so -> .so.0 -> .so.0.3.0 symlink chain;
          # the binary's DT_NEEDED names libgossamer.so.0, not libgossamer.so.
          cp -a "${libdir}"/libgossamer.so* "dist/${pkg}/lib/"
          cp LICENSE README.adoc "dist/${pkg}/"

          tar --sort=name --owner=0 --group=0 --numeric-owner \
              -czf "dist/${pkg}.tar.gz" -C dist "${pkg}"
          echo "pkg=${pkg}" >> "$GITHUB_OUTPUT"
          ls -l "dist/${pkg}.tar.gz"

      # The rpath is what makes bin/ + lib/ self-contained. Assert it by literal
      # text: an unexpanded $ORIGIN leaves a RUNPATH of /../lib that a bare
      # `grep RUNPATH` would still match.
      - name: Prove the packaged artifact is self-contained
        run: |
          set -euo pipefail
          pkg="${{ steps.package.outputs.pkg }}"
          bin="dist/${pkg}/bin/paint-type"

          # shellcheck disable=SC2016  # $ORIGIN is a literal rpath token, not a shell variable
          readelf -d "$bin" | grep -qF '$ORIGIN/../lib'
          echo "rpath present"

          # With LD_LIBRARY_PATH unset, the loader must find libgossamer through
          # the rpath alone — inside dist/lib, not anywhere on the system.
          # ld.so concatenates the RUNPATH literally, so the resolved path is
          # printed UNNORMALISED as ".../bin/../lib/..." — assert THAT text.
          # Matching "dist/<pkg>/lib" instead silently never matches.
          env -u LD_LIBRARY_PATH ldd "$bin" | grep gossamer
          env -u LD_LIBRARY_PATH ldd "$bin" \
            | grep -qF "dist/${pkg}/bin/../lib/libgossamer.so"
          if env -u LD_LIBRARY_PATH ldd "$bin" | grep -q 'not found'; then
            echo "::error::a dependency did not resolve in the packaged layout"
            env -u LD_LIBRARY_PATH ldd "$bin"
            exit 1
          fi
          echo "libgossamer resolves into the package"

          # A launch that survives 15s obtained a display, a GTK context and a
          # webview. The app prints nothing on success and dies in milliseconds
          # on failure, so 124 is the discriminator.
          set +e
          env -u LD_LIBRARY_PATH xvfb-run -a timeout 15 "$bin"
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            echo "::error::packaged binary exited $rc, expected 124 (still running)"
            exit 1
          fi
          echo "packaged binary launched and stayed up"

      - name: Compute artifact digests for provenance
        id: hashes
        run: |
          set -euo pipefail
          pkg="${{ steps.package.outputs.pkg }}"
          cd dist
          # sha256sum format, base64 encoded — exactly what the SLSA generator
          # expects. Never an empty string: attesting to zero subjects writes a
          # meaningless entry to the transparency log, and that cannot be undone.
          hashes="$(sha256sum "${pkg}.tar.gz" | base64 -w0)"
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"
          sha256sum "${pkg}.tar.gz"

      - name: Upload the package as a run artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.pkg }}
          path: dist/${{ steps.package.outputs.pkg }}.tar.gz
          retention-days: 14

      # Draft only. Publishing is irreversible — notifications fire and the URL
      # gets cited — so a human downloads the draft, runs it, and publishes.
      - name: Create DRAFT GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: |
            dist/${{ steps.package.outputs.pkg }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  provenance:
    name: SLSA Provenance
    # Tag-only: a dispatch dry run must not write to the public transparency
    # log, because a Rekor entry cannot be withdrawn.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: write
    # SLSA generator must run in a separate, isolated workflow
    # See: https://slsa.dev/spec/v1.0/requirements#build-l3
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      # Artifact-only for tag one: the provenance is downloadable from the run,
      # not attached to the draft release.
      upload-assets: false
