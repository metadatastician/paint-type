# rust.yml — Cargo build, test, clippy, fmt, and scaffold verification across
# all standalone Rust crates in src/* and tools/*.
name: Rust CI
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  check:
    name: Cargo check + clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install Zig 0.15
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.1
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            src/ephapax
            src/ptype_format
            src/paint_core
            src/paint_collab
            src/plugins
            src/host_core
            tools/abi-codegen
            tools/plugin-wizard
            tools/plugin-minter
            tools/plugin-harness
            tools/plugin-configurator
            tools/plugin-provisioner
      - name: Build libpt (Zig static library)
        run: |
          cd src/interface/ffi
          zig build
      - name: Cargo check across all crates
        run: |
          set -euo pipefail
          for crate in \
            src/ephapax \
            src/ptype_format \
            src/paint_core \
            src/paint_collab \
            src/plugins \
            src/host_core \
            tools/abi-codegen \
            tools/plugin-wizard \
            tools/plugin-minter \
            tools/plugin-harness \
            tools/plugin-configurator \
            tools/plugin-provisioner
          do
            echo "=== cargo check: $crate ==="
            cargo check --manifest-path "$crate/Cargo.toml" --all-targets
          done
      - name: Cargo clippy
        run: |
          set -uo pipefail
          CLIPPY_FAIL=0
          for crate in \
            src/ephapax \
            src/ptype_format \
            src/paint_core \
            src/paint_collab \
            src/plugins \
            src/host_core \
            tools/abi-codegen
          do
            LOG="$RUNNER_TEMP/clippy-$(echo "$crate" | tr '/' '_').log"
            if ! cargo clippy --manifest-path "$crate/Cargo.toml" --all-targets -- -D warnings >"$LOG" 2>&1; then
              cat "$LOG"
              MSG="$(grep -E 'error(\[|:)|warning:' -A 3 "$LOG" | tr '\n' ' ' | cut -c1-3500)"
              echo "::error title=clippy-${crate}::${MSG}"
              CLIPPY_FAIL=1
            fi
          done
          exit "$CLIPPY_FAIL"
      - name: Cargo fmt check
        if: always()
        run: |
          set -euo pipefail
          FMT_FAIL=0
          for crate in src/ephapax src/ptype_format src/paint_core; do
            if ! cargo fmt --manifest-path "$crate/Cargo.toml" --all -- --check; then
              FMT_FAIL=1
              cargo fmt --manifest-path "$crate/Cargo.toml" --all
            fi
          done
          if [ "$FMT_FAIL" -ne 0 ]; then
            B64="$(git diff | gzip -c | base64 -w0)"
            echo "::error title=rustfmt-b64::${B64}"
            git checkout -- .
            exit 1
          fi
  test:
    name: Cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install Zig 0.15
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.15.1
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            src/ephapax
            src/ptype_format
            src/paint_core
            src/paint_collab
            src/plugins
            src/host_core
            tools/abi-codegen
            tools/plugin-wizard
            tools/plugin-minter
            tools/plugin-harness
            tools/plugin-configurator
            tools/plugin-provisioner
      - name: Build libpt (Zig static library)
        run: |
          cd src/interface/ffi
          zig build
      - name: Run tests across all standalone crates
        run: |
          set -uo pipefail
          TEST_FAIL=0
          for crate in \
            src/ephapax \
            src/ptype_format \
            src/paint_core \
            src/paint_collab \
            src/plugins \
            src/host_core \
            tools/abi-codegen \
            tools/plugin-wizard \
            tools/plugin-minter \
            tools/plugin-harness \
            tools/plugin-configurator \
            tools/plugin-provisioner
          do
            echo "=== cargo test: $crate ==="
            LOG="$RUNNER_TEMP/test-$(echo "$crate" | tr '/' '_').log"
            if ! cargo test --manifest-path "$crate/Cargo.toml" --all-targets >"$LOG" 2>&1; then
              cat "$LOG"
              MSG="$(grep -E 'FAILED|panicked|error(\[|:)' -B 1 -A 4 "$LOG" | tr '\n' ' ' | cut -c1-3500)"
              echo "::error title=test-${crate}::${MSG}"
              TEST_FAIL=1
            fi
          done
          exit "$TEST_FAIL"
      - name: Smoke-test plugin-wizard non-interactive scaffolding
        run: |
          set -euo pipefail
          OUT_DIR="$(mktemp -d)"
          cargo run --manifest-path tools/plugin-wizard/Cargo.toml -- \
            --non-interactive \
            --type effect \
            --language rust \
            --id com.paint_type.test_blur \
            --name "Test Blur" \
            --description "Smoke-tested effect scaffold" \
            --output "$OUT_DIR/rust-effect"
          test -f "$OUT_DIR/rust-effect/plugin.toml"
          rm -rf "$OUT_DIR"
      - name: Write summary
        if: always()
        run: |
          echo "## Rust CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **cargo check (12 crates)**: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **cargo test (12 crates + wizard smoke)**: completed" >> "$GITHUB_STEP_SUMMARY"
