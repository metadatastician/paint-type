# SPDX-License-Identifier: PMPL-1.0-or-later
name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: scorecard
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    name: OSSF Scorecard Check
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@bd0df9ead7faf0cdfe0e13e7966d91e28d0101d4
    permissions:
      contents: read
      security-events: write
      id-token: write
    # Mark as non-critical to prevent workflow failure due to estate-wide issues
    # NOTE: continue-on-error removed - not allowed on jobs that use "uses:"
