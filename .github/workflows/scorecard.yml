# SPDX-License-Identifier: PMPL-1.0-or-later
name: OSSF Scorecard

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    name: OSSF Scorecard Check
    uses: metadatastician/standards/.github/workflows/scorecard-reusable.yml@2b6d30bba13d1ed7034fb03ec61b7011e4040896
    permissions:
      contents: read
      security-events: write
      id-token: write
    # Mark as non-critical to prevent workflow failure due to estate-wide template bugs
    continue-on-error: true
