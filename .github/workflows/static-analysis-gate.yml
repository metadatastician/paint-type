# SPDX-License-Identifier: AGPL-3.0-or-later
# Static Analysis Gate — panic-attack + hypatia + pons-asinorum + patch-bridge triage
#
# Full scanner stack feeding gitbot-fleet unified findings:
#   1. panic-attack assail — static weak-point detection (Rust/Zig/miniKanren)
#   2. hypatia scan — deterministic Elixir + 8-model classical neurosymbolic analysis
#   3. pons-asinorum scan — CFG + linear-typestate rookie-bug static analysis
#   4. patch-bridge triage — Rust crate advisory + vulnerability checks
#   5. deposit-findings — unified findings JSON (schema 1.2.0) for gitbot-fleet
name: Static Analysis Gate

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master, develop]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Job 1: panic-attack assail — static weak-point detection
  # ─────────────────────────────────────────────────────────────────────
  panic-attack-assail:
    name: panic-attack (assail)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: target-repo

      - name: Checkout panic-attack
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: hyperpolymath/panic-attack
          ref: b689a74d2762a1c19839ae3fbd59b7fe5ef920ea
          path: panic-attack

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable

      - name: Cache panic-attack binary
        id: cache-pa
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v5.0.5
        with:
          path: ~/.local/bin/panic-attack
          key: panic-attack-${{ hashFiles('panic-attack/Cargo.lock') }}

      - name: Build panic-attack
        if: steps.cache-pa.outputs.cache-hit != 'true'
        working-directory: panic-attack
        run: |
          cargo build --release --bin panic-attack
          mkdir -p ~/.local/bin
          cp target/release/panic-attack ~/.local/bin/

      - name: Run panic-attack assail
        working-directory: target-repo
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ~/.local/bin/panic-attack assail . \
            --output /tmp/assail-report.json \
            --output-format json || true

          if [ ! -f /tmp/assail-report.json ]; then
            echo '{"weak_points":[],"statistics":{"critical_count":0},"taint_matrix":{"rows":[]}}' > /tmp/assail-report.json
          fi

          CRITICAL=$(jq '.statistics.critical_count // ([.weak_points[]? | select(.severity == "Critical" or .severity == "critical")] | length)' /tmp/assail-report.json)
          TOTAL=$(jq '.weak_points | length' /tmp/assail-report.json)

          echo "=== panic-attack assail summary ==="
          echo "Total weak points: $TOTAL"
          echo "Critical weak points: $CRITICAL"

          {
            echo "## panic-attack assail Report"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Total weak points | $TOTAL |"
            echo "| Critical weak points | $CRITICAL |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::$CRITICAL critical weak point(s) found by panic-attack assail"
            exit 1
          fi

      - name: Upload assail findings artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: assail-report
          path: /tmp/assail-report.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Job 2: hypatia neurosymbolic scan
  # ─────────────────────────────────────────────────────────────────────
  hypatia-scan:
    name: hypatia (neurosymbolic scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: target-repo

      - name: Checkout hypatia
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: hyperpolymath/hypatia
          ref: aa34a4cc6ba39d873710ff39763fdb9cde715f9d
          path: hypatia

      - name: Set up Elixir / OTP
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.18'
          otp-version: '27'

      - name: Cache Mix dependencies and build
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v5.0.5
        with:
          path: |
            hypatia/deps
            hypatia/_build
          key: hypatia-mix-${{ hashFiles('hypatia/mix.lock') }}

      - name: Compile hypatia
        working-directory: hypatia
        env:
          MIX_ENV: prod
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
          mix compile

      - name: Run hypatia scan
        working-directory: hypatia
        env:
          MIX_ENV: prod
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          mix run --no-start -e '
            Application.ensure_all_started(:logger)
            [path, name, out] = System.argv()
            {:ok, findings} = Hypatia.Rules.Registry.scan(path, name)
            json = findings
              |> Enum.map(fn f ->
                f |> Map.from_struct() |> Map.new(fn
                  {k, v} when is_atom(v) and not is_boolean(v) and not is_nil(v) -> {k, Atom.to_string(v)}
                  pair -> pair
                end)
              end)
              |> Jason.encode!(pretty: true)
            File.write!(out, json)
            IO.puts("Hypatia found #{length(findings)} total finding(s)")
          ' -- "$GITHUB_WORKSPACE/target-repo" "$REPO_NAME" /tmp/hypatia-findings.json

          CRITICAL=$(jq '[.[] | select(.severity == "critical")] | length' /tmp/hypatia-findings.json)
          HIGH=$(jq '[.[] | select(.severity == "high")] | length' /tmp/hypatia-findings.json)
          TOTAL=$(jq 'length' /tmp/hypatia-findings.json)

          {
            echo "## Hypatia Neurosymbolic Scan Report"
            echo ""
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| Critical | $CRITICAL |"
            echo "| High | $HIGH |"
            echo "| Total | $TOTAL |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::$CRITICAL critical security/safety finding(s) from Hypatia"
            exit 1
          fi

      - name: Upload hypatia findings artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: hypatia-findings
          path: /tmp/hypatia-findings.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Job 3: pons-asinorum static rookie-bug & linear-typestate scan
  # ─────────────────────────────────────────────────────────────────────
  pons-asinorum-scan:
    name: pons-asinorum (CFG & typestate scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: target-repo

      - name: Checkout pons-asinorum
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: hyperpolymath/pons-asinorum
          ref: 32e55677d8fd1f3010848dee22e822c2f385c2a0
          path: pons-asinorum

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable

      - name: Cache pons binary
        id: cache-pons
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v5.0.5
        with:
          path: ~/.local/bin/pons
          key: pons-asinorum-${{ hashFiles('pons-asinorum/Cargo.lock') }}

      - name: Build pons-cli
        if: steps.cache-pons.outputs.cache-hit != 'true'
        working-directory: pons-asinorum
        run: |
          cargo build --release -p pons-cli --bin pons
          mkdir -p ~/.local/bin
          cp target/release/pons ~/.local/bin/

      - name: Run pons scan
        working-directory: target-repo
        run: |
          ~/.local/bin/pons scan --format json . > /tmp/pons-raw.json || true
          if jq -e 'type == "object" and (.findings | type == "array")' /tmp/pons-raw.json >/dev/null 2>&1; then
            jq '.findings' /tmp/pons-raw.json > /tmp/pons-findings.json
          else
            echo '[]' > /tmp/pons-findings.json
          fi
          TOTAL=$(jq 'length' /tmp/pons-findings.json)
          ERRORS=$(jq '[.[] | select((.severity // "") | ascii_upcase == "ERROR")] | length' /tmp/pons-findings.json)
          WARNS=$(jq '[.[] | select((.severity // "") | ascii_upcase == "WARN")] | length' /tmp/pons-findings.json)

          {
            echo "## pons-asinorum CFG & Typestate Report (advisory)"
            echo ""
            echo "| Severity | Count |"
            echo "|----------|-------|"
            echo "| ERROR | $ERRORS |"
            echo "| WARN | $WARNS |"
            echo "| Total | $TOTAL |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pons findings artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: pons-findings
          path: /tmp/pons-findings.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Job 4: Patch-bridge security triage — dependency vulnerabilities
  # ─────────────────────────────────────────────────────────────────────
  patch-bridge-triage:
    name: patch-bridge (dependency triage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable

      - name: Cache cargo-audit binary
        id: cache-audit
        uses: actions/cache@2f8e54208210a422b2efd51efaa6bd6d7ca8920f # v5.0.5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.21.2

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.21.2 --locked

      - name: Audit Rust dependencies
        working-directory: src/paint_core
        run: |
          cargo audit --json > /tmp/cargo-audit.json 2>/dev/null || true

          if [ -s /tmp/cargo-audit.json ]; then
            VULN_COUNT=$(jq '.vulnerabilities.count // 0' /tmp/cargo-audit.json)
            WARN_COUNT=$(jq '.warnings | to_entries | map(.value | length) | add // 0' /tmp/cargo-audit.json)
          else
            VULN_COUNT=0
            WARN_COUNT=0
            echo '{"vulnerabilities":{"count":0,"list":[]},"warnings":{}}' > /tmp/cargo-audit.json
          fi

          {
            echo "## Patch-Bridge Security Triage"
            echo ""
            echo "| Category | Count |"
            echo "|----------|-------|"
            echo "| Known vulnerabilities | $VULN_COUNT |"
            echo "| Warnings (unmaintained/yanked) | $WARN_COUNT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "::error::$VULN_COUNT known vulnerability(ies) in Rust dependencies"
            exit 1
          fi

      - name: Upload cargo-audit artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-audit-report
          path: /tmp/cargo-audit.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────
  # Job 5: Deposit unified findings for gitbot-fleet consumption
  # ─────────────────────────────────────────────────────────────────────
  deposit-findings:
    name: Deposit unified findings (gitbot-fleet)
    needs: [panic-attack-assail, hypatia-scan, pons-asinorum-scan, patch-bridge-triage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all findings artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/raw-artifacts

      - name: Synthesize unified findings deposit
        run: |
          mkdir -p findings

          ASSAIL="/tmp/raw-artifacts/assail-report/assail-report.json"
          HYPATIA="/tmp/raw-artifacts/hypatia-findings/hypatia-findings.json"
          PONS="/tmp/raw-artifacts/pons-findings/pons-findings.json"
          AUDIT="/tmp/raw-artifacts/cargo-audit-report/cargo-audit.json"

          [ -f "$ASSAIL" ] || echo '{"weak_points":[],"statistics":{"critical_count":0}}' > /tmp/empty-assail.json
          [ -f "$HYPATIA" ] || echo '[]' > /tmp/empty-hypatia.json
          [ -f "$PONS" ] || echo '[]' > /tmp/empty-pons.json
          [ -f "$AUDIT" ] || echo '{"vulnerabilities":{"count":0,"list":[]},"warnings":{}}' > /tmp/empty-audit.json

          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile assail "${ASSAIL:-/tmp/empty-assail.json}" \
            --slurpfile hypatia "${HYPATIA:-/tmp/empty-hypatia.json}" \
            --slurpfile pons "${PONS:-/tmp/empty-pons.json}" \
            --slurpfile audit "${AUDIT:-/tmp/empty-audit.json}" \
            '{
              schema_version: "1.2.0",
              repository: $repo,
              commit_sha: $sha,
              github_run_id: $run_id,
              generated_at: $timestamp,
              scanners: {
                panic_attack: {
                  weak_point_count: ($assail[0].weak_points | length),
                  critical_count: ($assail[0].statistics.critical_count // 0),
                  weak_points: ($assail[0].weak_points // [])
                },
                hypatia: {
                  finding_count: ($hypatia[0] | length),
                  critical_count: ([$hypatia[0][] | select(.severity == "critical")] | length),
                  findings: ([ $hypatia[0][] | . + {scanner: "hypatia"} ])
                },
                pons_asinorum: {
                  finding_count: ($pons[0] | length),
                  error_count: ([$pons[0][] | select((.severity // "") | ascii_upcase == "ERROR")] | length),
                  findings: ([ $pons[0][] | . + {scanner: "pons-asinorum"} ])
                },
                patch_bridge: {
                  vulnerability_count: ($audit[0].vulnerabilities.count // 0),
                  vulnerabilities: ($audit[0].vulnerabilities.list // [])
                }
              }
            }' > findings/unified-findings.json

          jq '. | {schema_version, repository, commit_sha, generated_at, summary: {
            panic_attack_weak_points: .scanners.panic_attack.weak_point_count,
            hypatia_findings: .scanners.hypatia.finding_count,
            pons_findings: .scanners.pons_asinorum.finding_count,
            patch_bridge_vulns: .scanners.patch_bridge.vulnerability_count
          }}' findings/unified-findings.json

      - name: Upload unified gitbot-fleet findings artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: findings
          path: findings/unified-findings.json
          retention-days: 30
