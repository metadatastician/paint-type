# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: AGPL-3.0-or-later
# Static Analysis Gate — Required by branch protection rules.
# Runs panic-attack and hypatia, deposits findings for gitbot-fleet learning.
name: Static Analysis Gate
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]

concurrency:
  group: static-analysis-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
jobs:
  # ---------------------------------------------------------------------------
  # Job 1: panic-attack assail
  # ---------------------------------------------------------------------------
  panic-attack-assail:
    name: panic-attack assail
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Build panic-attack from pinned source
        id: install
        run: |
          set -euo pipefail
          # PINNED by commit SHA, following the hypatia-scan job below.
          #
          # This step used to curl an executable from
          #   .../releases/latest/download/panic-attack-linux-x86_64
          # which is both a moving target (#101) and, as of 2026-09-24, a
          # 404: panic-attack's only release (v1.0.1) carries zero assets,
          # and /releases/latest resolves to it. The `curl --head` test
          # therefore always failed, `installed` was always false, every
          # scanning step below was skipped, and the job reported SUCCESS
          # having scanned nothing (#100).
          #
          # Building from source at a pinned commit is strictly stronger than
          # a checksum-pinned binary download: nothing prebuilt is trusted,
          # and the toolchain is the runner's own.
          #
          # 27b3d93b11fbfc03cee695e791904d741ce2b24b is main HEAD as of
          # 2026-09-24 and reports version 2.5.5. The CLI contract below was
          # verified against a build of exactly this commit.
          PA_SHA=27b3d93b11fbfc03cee695e791904d741ce2b24b
          git clone -q --filter=blob:none \
            https://github.com/hyperpolymath/panic-attack.git "$HOME/panic-attack"
          git -C "$HOME/panic-attack" checkout -q "$PA_SHA"
          # FAIL CLOSED, as the hypatia job does. A gate that cannot run must
          # go red; it must not skip itself green.
          test -f "$HOME/panic-attack/Cargo.toml" \
            || { echo "::error::panic-attack checkout has no Cargo.toml at $PA_SHA"; exit 1; }
          cargo install --path "$HOME/panic-attack" --bin panic-attack --locked --quiet \
            || { echo "::error::panic-attack failed to build at $PA_SHA"; exit 1; }
          command -v panic-attack >/dev/null \
            || { echo "::error::panic-attack built but is not on PATH"; exit 1; }
          panic-attack --version
          echo "installed=true" >> "$GITHUB_OUTPUT"
      - name: Run panic-attack assail
        id: assail
        if: steps.install.outputs.installed == 'true'
        run: |
          # The report is an OBJECT (AssailReport, schema_version "2.5"), not a
          # top-level array of findings. Findings live in `.weak_points[]`, with
          # `severity` CAPITALISED ("Critical"/"High"/"Medium"/"Low") and the
          # text in `.description`, not `.message`.
          #
          # The previous version of this step got all three wrong AND passed a
          # flag that does not exist. Verified against a real build at
          # 27b3d93:
          #
          #   panic-attack assail --format json .
          #     -> exit 2, "error: unexpected argument '--format' found"
          #
          #   jq '. | length' report.json
          #     -> 10, the count of top-level KEYS, not of findings
          #
          #   jq '[.[] | select(.severity == "critical")] | length'
          #     -> jq: error: Cannot index string with string "severity"
          #        (swallowed by `|| echo 0`, so CRITICAL was always 0)
          #
          # `--headless` is the documented CI-safe mode; `--output` writes the
          # report to a file so stdout stays clean. Exit status is propagated:
          # it was previously captured into PA_EXIT, echoed to an output, and
          # then never checked.
          set +e
          panic-attack assail --headless --output panic-attack-report.json .
          PA_EXIT=$?
          set -e
          if [ "$PA_EXIT" -ne 0 ]; then
            echo "::error::panic-attack assail failed with exit ${PA_EXIT}"
            exit "$PA_EXIT"
          fi
          # Assert the shape rather than defaulting to a clean result.
          if [ ! -s panic-attack-report.json ] \
             || ! jq -e 'type == "object" and (.weak_points | type == "array")' \
                  panic-attack-report.json >/dev/null 2>&1; then
            echo "::error::panic-attack did not produce a valid AssailReport"
            exit 1
          fi
          SCHEMA=$(jq -r '.schema_version // "unknown"' panic-attack-report.json)
          if [ "$SCHEMA" != "2.5" ]; then
            echo "::warning::AssailReport schema_version is ${SCHEMA}, expected 2.5 — the jq paths below may be stale"
          fi

          # Suppressed findings are retained for audit but excluded from CI
          # counts by the tool's own contract (WeakPoint.suppressed).
          FILTER='.weak_points[] | select(.suppressed != true)'
          TOTAL=$(jq    "[$FILTER] | length" panic-attack-report.json)
          CRITICAL=$(jq "[$FILTER | select(.severity == \"Critical\")] | length" panic-attack-report.json)
          HIGH=$(jq     "[$FILTER | select(.severity == \"High\")] | length"     panic-attack-report.json)
          MEDIUM=$(jq   "[$FILTER | select(.severity == \"Medium\")] | length"   panic-attack-report.json)
          LOW=$(jq      "[$FILTER | select(.severity == \"Low\")] | length"      panic-attack-report.json)

          # Normalise into the same findings-array shape hypatia-scan emits, so
          # deposit-findings can tag and concatenate both unchanged: severity
          # lowercased, `.message` carrying the description. Both the raw
          # report and this array are uploaded below.
          jq '[.weak_points[] | select(.suppressed != true) | {
                 file:     (.file // null),
                 line:     (.line // null),
                 severity: (.severity | ascii_downcase),
                 message:  .description,
                 category: .category
               }]' panic-attack-report.json > panic-attack-findings.json

          echo "schema=$SCHEMA" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM" >> "$GITHUB_OUTPUT"
          echo "low=$LOW" >> "$GITHUB_OUTPUT"
          echo "exit_code=$PA_EXIT" >> "$GITHUB_OUTPUT"
      - name: Emit check annotations
        if: steps.install.outputs.installed == 'true'
        run: |
          # Annotations only anchor to a file when the path is relative to the
          # workspace, so strip the absolute prefix as the hypatia job does.
          jq -r --arg ws "$GITHUB_WORKSPACE/" '
            .[] | select(.file != null) |
            ((.file | ltrimstr($ws)) as $f |
             if .severity == "critical" or .severity == "high" then
               "::error file=\($f),line=\(.line // 1)::[panic-attack] \(.category): \(.message)"
             else
               "::warning file=\($f),line=\(.line // 1)::[panic-attack] \(.category): \(.message)"
             end)
          ' panic-attack-findings.json || true
      - name: Write step summary
        if: steps.install.outputs.installed == 'true'
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## panic-attack assail Results

          Report schema: \`${{ steps.assail.outputs.schema }}\`
          Suppressed findings are excluded, per the tool's own contract.

          | Severity | Count |
          |----------|-------|
          | Critical | ${{ steps.assail.outputs.critical }} |
          | High     | ${{ steps.assail.outputs.high }} |
          | Medium   | ${{ steps.assail.outputs.medium }} |
          | Low      | ${{ steps.assail.outputs.low }} |
          | **Total**| ${{ steps.assail.outputs.total }} |
          EOF
      - name: Upload panic-attack findings
        uses: actions/upload-artifact@v7.0.1
        with:
          name: panic-attack-findings
          path: |
            panic-attack-findings.json
            panic-attack-report.json
          retention-days: 90
      - name: Fail on critical findings
        if: steps.install.outputs.installed == 'true' && steps.assail.outputs.critical > 0
        run: |
          echo "::error::panic-attack found ${{ steps.assail.outputs.critical }} critical issue(s) — blocking merge"
          exit 1
  # ---------------------------------------------------------------------------
  # Job 2: hypatia-scan
  # ---------------------------------------------------------------------------
  hypatia-scan:
    name: Hypatia neurosymbolic scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Elixir for Hypatia scanner
        id: beam
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.3'
      - name: Clone and build Hypatia
        id: build
        run: |
          set -euo pipefail
          # PINNED. An unpinned clone of hypatia's default branch let this gate's
          # verdict change with no commit to paint-type.
          HYPATIA_SHA=8e8943f329934877bcdba31d54397aa2496273d2
          git clone -q --filter=blob:none \
            https://github.com/hyperpolymath/hypatia.git "$HOME/hypatia"
          git -C "$HOME/hypatia" checkout -q "$HYPATIA_SHA"
          # FAIL CLOSED. This step was previously `continue-on-error: true` with a
          # `|| true` on the clone. A network hiccup, a rate limit or a repo rename
          # therefore left mix.exs absent -> ready=false -> the scan step skipped ->
          # a stub `[]` written -> "Fail on critical" skipped -> the job reported
          # SUCCESS having scanned nothing. A gate that cannot run must go red.
          test -f "$HOME/hypatia/mix.exs" \
            || { echo "::error::hypatia checkout has no mix.exs at $HYPATIA_SHA"; exit 1; }
          cd "$HOME/hypatia"
          # Build escript if neither hypatia nor hypatia-v2 exists
          if [ ! -f hypatia ] && [ ! -f hypatia-v2 ]; then
            mix deps.get
            mix escript.build
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Run Hypatia scan
        id: scan
        if: steps.build.outputs.ready == 'true'
        run: |
          set +e
          HYPATIA_FORMAT=json "$HOME/hypatia/hypatia-cli.sh" scan . --exit-zero > hypatia-findings.json
          HYP_EXIT=$?
          set -e

          # --exit-zero is Hypatia's own documented CI recipe (lib/hypatia/cli.ex),
          # for exactly this case: "use in CI when a downstream step gates on
          # severity counts". Findings go to stdout, the one-line summary to
          # stderr, and the process exits 0 unless the SCANNER itself failed.
          #
          # Do NOT redirect stderr into the payload with `2>&1`: that folds the
          # summary line into the JSON, so every parse fails, the old `[]`
          # fallback substituted a clean result, CRITICAL was always 0, and the
          # gate below could never fire on any input. Keep stderr on the log.
          if [ "$HYP_EXIT" -ne 0 ]; then
            echo "::error::Hypatia scanner execution failed with exit ${HYP_EXIT}"
            exit "$HYP_EXIT"
          fi
          # `jq empty` is NOT sufficient -- it succeeds on any valid JSON,
          # including a bare string, object or null. Assert the array.
          if [ ! -s hypatia-findings.json ] || ! jq -e 'type == "array"' hypatia-findings.json >/dev/null; then
            echo "::error::Hypatia did not produce a valid JSON findings array"
            exit 1
          fi

          TOTAL=$(jq '. | length' hypatia-findings.json 2>/dev/null || echo 0)
          CRITICAL=$(jq '[.[] | select(.severity == "critical")] | length' hypatia-findings.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.[] | select(.severity == "high")] | length' hypatia-findings.json 2>/dev/null || echo 0)
          MEDIUM=$(jq '[.[] | select(.severity == "medium")] | length' hypatia-findings.json 2>/dev/null || echo 0)
          LOW=$(jq '[.[] | select(.severity == "low")] | length' hypatia-findings.json 2>/dev/null || echo 0)

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM" >> "$GITHUB_OUTPUT"
          echo "low=$LOW" >> "$GITHUB_OUTPUT"
      - name: Emit check annotations
        if: steps.build.outputs.ready == 'true'
        run: |
          jq -r --arg ws "$GITHUB_WORKSPACE/" '
            .[] | select(.file != null) |
            # `.reason`, NOT `.message`: no such key exists in the findings
            # schema, so every annotation used to render as "[hypatia] null".
            # `.file` is an absolute runner path; an annotation only anchors to
            # a file when the path is relative to the workspace.
            ((.file | ltrimstr($ws)) as $f |
             if .severity == "critical" or .severity == "high" then
               "::error file=\($f),line=\(.line // 1)::[hypatia] \(.reason)"
             else
               "::warning file=\($f),line=\(.line // 1)::[hypatia] \(.reason)"
             end)
          ' hypatia-findings.json || true
      - name: Write step summary
        if: steps.build.outputs.ready == 'true'
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Hypatia Scan Results

          | Severity | Count |
          |----------|-------|
          | Critical | ${{ steps.scan.outputs.critical }} |
          | High     | ${{ steps.scan.outputs.high }} |
          | Medium   | ${{ steps.scan.outputs.medium }} |
          | Low      | ${{ steps.scan.outputs.low }} |
          | **Total**| ${{ steps.scan.outputs.total }} |
          EOF
      - name: Upload hypatia findings
        uses: actions/upload-artifact@v7.0.1
        with:
          name: hypatia-findings
          path: hypatia-findings.json
          retention-days: 90
      - name: Fail on critical security findings
        if: steps.build.outputs.ready == 'true' && steps.scan.outputs.critical > 0
        run: |
          echo "::error::Hypatia found ${{ steps.scan.outputs.critical }} critical security issue(s) — blocking merge"
          exit 1
  # ---------------------------------------------------------------------------
  # Job 3: patch-bridge triage (CVE contextual assessment)
  # ---------------------------------------------------------------------------
  patch-bridge-triage:
    name: Patch Bridge CVE triage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Report that this capability does not exist
        run: |
          # FAIL CLOSED. There is nothing to fix in place here, because the
          # thing this job invokes is not a feature of the tool.
          #
          # Verified 2026-09-24 against a build of panic-attack at
          # 27b3d93b11fbfc03cee695e791904d741ce2b24b (main HEAD, v2.5.5):
          #
          #   $ panic-attack bridge triage --format json .
          #   error: unrecognized subcommand 'bridge'
          #   exit 2
          #
          # `panic-attack --help` lists 24 subcommands and `bridge` is not
          # among them. The nearest relative is `assay` ("survey a target for
          # proven-library substitution candidates"), which is dependency
          # substitution, not CVE triage — repointing this job at it would
          # rename the gap rather than close it.
          #
          # Previously this job downloaded a binary from a URL that 404s, so
          # `installed` was always false, the triage step never ran, a stub
          # `{"unmitigable":0}` was written, and the job reported SUCCESS
          # having triaged nothing. Worse, even had the subcommand existed,
          # the final step only echoed `::warning::` — a step named "Fail on
          # unmitigable CVEs in critical paths" that contained no `exit 1`
          # and so could never fail.
          #
          # So this check has never executed. It is now red on purpose: a
          # permanently-green check that never ran is worse than an absent
          # one, because it is read as coverage.
          #
          # To clear this, an owner must pick one:
          #   1. implement CVE triage in panic-attack and repoint this job;
          #   2. delete this job and the `patch_bridge` field that
          #      deposit-findings reads from its artifact;
          #   3. replace it with the real CVE source (OSV / cargo-audit),
          #      which is a different tool and a different schema.
          echo "::error::patch-bridge-triage invokes 'panic-attack bridge triage', a subcommand that does not exist in panic-attack 2.5.5. This check has never executed. See the comment in this step for the three ways to clear it."
          {
            echo "## Patch Bridge CVE Triage"
            echo ""
            echo "**Not run.** \`panic-attack bridge triage\` is not a real"
            echo "subcommand — \`panic-attack --help\` lists 24 subcommands and"
            echo "\`bridge\` is not one of them (verified at 27b3d93, v2.5.5)."
            echo ""
            echo "This job previously reported success by downloading a binary"
            echo "from a URL that 404s, skipping the scan, and writing a stub"
            echo "report with \`unmitigable: 0\`. No CVE triage has ever run on"
            echo "this repository."
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p reports
          cat > reports/bridge-report.json <<'JSON'
          {
            "status": "not_implemented",
            "reason": "panic-attack has no 'bridge' subcommand as of v2.5.5 (27b3d93)",
            "cves": [],
            "mitigated": null,
            "unmitigable": null,
            "concatenative": null,
            "informational": null
          }
          JSON
          exit 1
      - name: Upload bridge report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bridge-report
          path: reports/bridge-report.json
          retention-days: 90
          if-no-files-found: warn
  # ---------------------------------------------------------------------------
  # Job 4: deposit-findings (combines + archives for gitbot-fleet)
  # ---------------------------------------------------------------------------
  deposit-findings:
    name: Deposit findings for gitbot-fleet
    runs-on: ubuntu-latest
    needs: [panic-attack-assail, hypatia-scan, patch-bridge-triage]
    if: always()
    steps:
      - name: Download panic-attack findings
        uses: actions/download-artifact@v8.0.1
        with:
          name: panic-attack-findings
          path: findings/
      - name: Download hypatia findings
        uses: actions/download-artifact@v8.0.1
        with:
          name: hypatia-findings
          path: findings/
      - name: Download bridge report
        uses: actions/download-artifact@v8.0.1
        with:
          name: bridge-report
          path: findings/
      - name: Combine findings into unified report
        id: combine
        run: |
          PA_FILE="findings/panic-attack-findings.json"
          HYP_FILE="findings/hypatia-findings.json"

          # Ensure both files exist and are valid JSON arrays
          for f in "$PA_FILE" "$HYP_FILE"; do
            if [ ! -s "$f" ] || ! jq empty "$f" 2>/dev/null; then
              echo "[]" > "$f"
            fi
          done

          # Tag each finding with its source scanner
          jq '[.[] | . + {"scanner": "panic-attack"}]' "$PA_FILE" > "$RUNNER_TEMP/pa-tagged.json"
          jq '[.[] | . + {"scanner": "hypatia"}]'      "$HYP_FILE" > "$RUNNER_TEMP/hyp-tagged.json"

          # Read bridge report. There is no honest zero to substitute here:
          # patch-bridge-triage cannot run because `panic-attack bridge triage`
          # is not a real subcommand, so a missing artifact means "not run",
          # never "no CVEs". The old fallback wrote unmitigable: 0, which
          # reads downstream as a clean triage.
          BRIDGE_FILE="findings/bridge-report.json"
          if [ ! -s "$BRIDGE_FILE" ] || ! jq empty "$BRIDGE_FILE" 2>/dev/null; then
            echo '{"status":"not_run","reason":"bridge-report artifact absent; patch-bridge-triage has no working implementation","cves":[],"mitigated":null,"unmitigable":null,"concatenative":null,"informational":null}' > "$BRIDGE_FILE"
            echo "::warning::bridge-report artifact was absent or invalid; recorded as not_run rather than as a clean triage"
          fi

          # Build unified report envelope
          jq -n \
            --arg repo   "${{ github.repository }}" \
            --arg sha    "${{ github.sha }}" \
            --arg ref    "${{ github.ref }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg ts     "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile pa     "$RUNNER_TEMP/pa-tagged.json" \
            --slurpfile hyp    "$RUNNER_TEMP/hyp-tagged.json" \
            --slurpfile bridge "$BRIDGE_FILE" \
            '{
              schema_version: "1.1.0",
              repository: $repo,
              commit_sha: $sha,
              ref: $ref,
              run_id: $run_id,
              timestamp: $ts,
              findings: ($pa[0] + $hyp[0]),
              patch_bridge: $bridge[0]
            }' > findings/unified-findings.json

          TOTAL=$(jq '.findings | length' findings/unified-findings.json)
          CRITICAL=$(jq '[.findings[] | select(.severity == "critical")] | length' findings/unified-findings.json)
          HIGH=$(jq '[.findings[] | select(.severity == "high")] | length' findings/unified-findings.json)
          MEDIUM=$(jq '[.findings[] | select(.severity == "medium")] | length' findings/unified-findings.json)
          LOW=$(jq '[.findings[] | select(.severity == "low")] | length' findings/unified-findings.json)

          echo "total=$TOTAL"       >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH"         >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM"     >> "$GITHUB_OUTPUT"
          echo "low=$LOW"           >> "$GITHUB_OUTPUT"
      - name: Upload unified findings (fleet scanner picks these up)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: unified-findings
          path: findings/unified-findings.json
          retention-days: 90
      - name: Write deposit summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Unified Findings Deposit

          **Repository:** ${{ github.repository }}
          **Commit:** \`${{ github.sha }}\`
          **Deposited at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          | Severity | Count |
          |----------|-------|
          | Critical | ${{ steps.combine.outputs.critical }} |
          | High     | ${{ steps.combine.outputs.high }} |
          | Medium   | ${{ steps.combine.outputs.medium }} |
          | Low      | ${{ steps.combine.outputs.low }} |
          | **Total**| ${{ steps.combine.outputs.total }} |

          Findings saved as \`unified-findings\` artifact.
          The gitbot-fleet scanner will ingest these on its next pass.
          EOF
