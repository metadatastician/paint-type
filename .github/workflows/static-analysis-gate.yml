# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: AGPL-3.0-or-later
# Static Analysis Gate — Required by branch protection rules.
# Runs panic-attack, hypatia, pons-asinorum, and patch-bridge CVE triage,
# depositing unified findings for gitbot-fleet learning.
name: Static Analysis Gate
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]

concurrency:
  group: static-analysis-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: panic-attack assail
  # ---------------------------------------------------------------------------
  panic-attack-assail:
    name: panic-attack assail
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PA_SHA: 27b3d93b11fbfc03cee695e791904d741ce2b24b
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache panic-attack binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5
        with:
          path: ~/.panic-attack
          key: panic-attack-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PA_SHA }}

      - name: Build panic-attack from pinned source
        id: install
        run: |
          set -euo pipefail
          BIN="$HOME/.panic-attack/bin/panic-attack"
          if [ ! -x "$BIN" ]; then
            git clone -q --filter=blob:none \
              https://github.com/hyperpolymath/panic-attack.git "$RUNNER_TEMP/panic-attack-src"
            git -C "$RUNNER_TEMP/panic-attack-src" checkout -q "$PA_SHA"
            if [ ! -f "$RUNNER_TEMP/panic-attack-src/Cargo.toml" ]; then
              echo "::error::panic-attack checkout has no Cargo.toml at $PA_SHA"
              exit 1
            fi
            cargo install --path "$RUNNER_TEMP/panic-attack-src" --bin panic-attack \
              --locked --quiet --root "$HOME/.panic-attack"
          fi
          export PATH="$HOME/.panic-attack/bin:$PATH"
          if ! command -v panic-attack >/dev/null; then
            echo "::error::panic-attack binary is not available on PATH"
            exit 1
          fi
          panic-attack --version
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: Run panic-attack assail
        id: assail
        if: steps.install.outputs.installed == 'true'
        run: |
          export PATH="$HOME/.panic-attack/bin:$PATH"
          set +e
          panic-attack assail --headless --output panic-attack-report.json .
          PA_EXIT=$?
          set -e
          if [ "$PA_EXIT" -ne 0 ]; then
            echo "::error::panic-attack assail failed with exit ${PA_EXIT}"
            exit "$PA_EXIT"
          fi
          if [ ! -s panic-attack-report.json ] \
             || ! jq -e 'type == "object" and (.weak_points | type == "array")' \
                  panic-attack-report.json >/dev/null 2>&1; then
            echo "::error::panic-attack did not produce a valid AssailReport"
            exit 1
          fi
          SCHEMA=$(jq -r '.schema_version // "unknown"' panic-attack-report.json)
          if [ "$SCHEMA" != "2.5" ]; then
            echo "::warning::AssailReport schema_version is ${SCHEMA}, expected 2.5"
          fi

          FILTER='.weak_points[] | select(.suppressed != true)'
          TOTAL=$(jq    "[$FILTER] | length" panic-attack-report.json)
          CRITICAL=$(jq "[$FILTER | select(.severity == \"Critical\")] | length" panic-attack-report.json)
          HIGH=$(jq     "[$FILTER | select(.severity == \"High\")] | length"     panic-attack-report.json)
          MEDIUM=$(jq   "[$FILTER | select(.severity == \"Medium\")] | length"   panic-attack-report.json)
          LOW=$(jq      "[$FILTER | select(.severity == \"Low\")] | length"      panic-attack-report.json)

          jq '[.weak_points[] | select(.suppressed != true) | {
                 file:     (.file // .location // null),
                 line:     (.line // null),
                 severity: (.severity | ascii_downcase),
                 message:  .description,
                 category: .category
               }]' panic-attack-report.json > panic-attack-findings.json

          echo "schema=$SCHEMA" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM" >> "$GITHUB_OUTPUT"
          echo "low=$LOW" >> "$GITHUB_OUTPUT"
          echo "exit_code=$PA_EXIT" >> "$GITHUB_OUTPUT"

      - name: Emit check annotations
        if: steps.install.outputs.installed == 'true'
        run: |
          if jq -r --arg ws "$GITHUB_WORKSPACE/" '
            .[] | select(.file != null) |
            ((.file | ltrimstr($ws)) as $f |
             if .severity == "critical" or .severity == "high" then
               "::error file=\($f),line=\(.line // 1)::[panic-attack] \(.category): \(.message)"
             else
               "::warning file=\($f),line=\(.line // 1)::[panic-attack] \(.category): \(.message)"
             end)
          ' panic-attack-findings.json; then :; fi

      - name: Write step summary
        if: steps.install.outputs.installed == 'true'
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## panic-attack assail Results

          Report schema: \`${{ steps.assail.outputs.schema }}\`
          Suppressed findings are excluded, per the tool's own contract.

          | Severity | Count |
          |----------|-------|
          | Critical | ${{ steps.assail.outputs.critical }} |
          | High     | ${{ steps.assail.outputs.high }} |
          | Medium   | ${{ steps.assail.outputs.medium }} |
          | Low      | ${{ steps.assail.outputs.low }} |
          | **Total**| ${{ steps.assail.outputs.total }} |
          EOF

      - name: Upload panic-attack findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panic-attack-findings
          path: |
            panic-attack-findings.json
            panic-attack-report.json
          retention-days: 90

      - name: Fail on critical findings
        if: steps.install.outputs.installed == 'true' && steps.assail.outputs.critical > 0
        run: |
          echo "::error::panic-attack found ${{ steps.assail.outputs.critical }} critical issue(s) — blocking merge"
          exit 1

  # ---------------------------------------------------------------------------
  # Job 2: hypatia-scan
  # ---------------------------------------------------------------------------
  hypatia-scan:
    name: Hypatia neurosymbolic scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HYPATIA_SHA: aa34a4cc6ba39d873710ff39763fdb9cde715f9d
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Elixir for Hypatia scanner
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.3'

      - name: Cache built Hypatia scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5
        with:
          path: ~/hypatia
          key: hypatia-scanner-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.HYPATIA_SHA }}

      - name: Clone and build Hypatia
        id: build
        run: |
          set -euo pipefail
          if [ ! -f "$HOME/hypatia/mix.exs" ]; then
            rm -rf "$HOME/hypatia"
            git clone -q --filter=blob:none \
              https://github.com/hyperpolymath/hypatia.git "$HOME/hypatia"
            git -C "$HOME/hypatia" checkout -q "$HYPATIA_SHA"
          fi
          if [ ! -f "$HOME/hypatia/mix.exs" ]; then
            echo "::error::hypatia checkout has no mix.exs at $HYPATIA_SHA"
            exit 1
          fi
          cd "$HOME/hypatia"
          if [ ! -f hypatia ] && [ ! -f hypatia-v2 ]; then
            mix deps.get
            mix escript.build
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Run Hypatia scan
        id: scan
        if: steps.build.outputs.ready == 'true'
        run: |
          set +e
          HYPATIA_FORMAT=json "$HOME/hypatia/hypatia-cli.sh" scan . --exit-zero > hypatia-findings.json
          HYP_EXIT=$?
          set -e

          if [ "$HYP_EXIT" -ne 0 ]; then
            echo "::error::Hypatia scanner execution failed with exit ${HYP_EXIT}"
            exit "$HYP_EXIT"
          fi
          if [ ! -s hypatia-findings.json ] || ! jq -e 'type == "array"' hypatia-findings.json >/dev/null; then
            echo "::error::Hypatia did not produce a valid JSON findings array"
            exit 1
          fi

          TOTAL=$(jq '. | length' hypatia-findings.json)
          CRITICAL=$(jq '[.[] | select(.severity == "critical")] | length' hypatia-findings.json)
          HIGH=$(jq '[.[] | select(.severity == "high")] | length' hypatia-findings.json)
          MEDIUM=$(jq '[.[] | select(.severity == "medium")] | length' hypatia-findings.json)
          LOW=$(jq '[.[] | select(.severity == "low")] | length' hypatia-findings.json)

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM" >> "$GITHUB_OUTPUT"
          echo "low=$LOW" >> "$GITHUB_OUTPUT"

      - name: Emit check annotations
        if: steps.build.outputs.ready == 'true'
        run: |
          if jq -r --arg ws "$GITHUB_WORKSPACE/" '
            .[] | select(.file != null) |
            ((.file | ltrimstr($ws)) as $f |
             if .severity == "critical" or .severity == "high" then
               "::error file=\($f),line=\(.line // 1)::[hypatia] \(.reason)"
             else
               "::warning file=\($f),line=\(.line // 1)::[hypatia] \(.reason)"
             end)
          ' hypatia-findings.json; then :; fi

      - name: Write step summary
        if: steps.build.outputs.ready == 'true'
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Hypatia Scan Results

          | Severity | Count |
          |----------|-------|
          | Critical | ${{ steps.scan.outputs.critical }} |
          | High     | ${{ steps.scan.outputs.high }} |
          | Medium   | ${{ steps.scan.outputs.medium }} |
          | Low      | ${{ steps.scan.outputs.low }} |
          | **Total**| ${{ steps.scan.outputs.total }} |
          EOF

      - name: Upload hypatia findings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hypatia-findings
          path: hypatia-findings.json
          retention-days: 90

      - name: Fail on critical security findings
        if: steps.build.outputs.ready == 'true' && steps.scan.outputs.critical > 0
        run: |
          echo "::error::Hypatia found ${{ steps.scan.outputs.critical }} critical security issue(s) — blocking merge"
          exit 1

  # ---------------------------------------------------------------------------
  # Job 3: pons-asinorum rookie-bug & linear-typestate static analyzer
  # ---------------------------------------------------------------------------
  pons-asinorum-scan:
    name: pons-asinorum scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PONS_SHA: 32e55677d8fd1f3010848dee22e822c2f385c2a0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache built pons-asinorum binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.5
        with:
          path: ~/.pons
          key: pons-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.PONS_SHA }}

      - name: Install pons-asinorum from pinned source
        run: |
          set -euo pipefail
          BIN="$HOME/.pons/bin/pons"
          if [ ! -x "$BIN" ]; then
            cargo install --git https://github.com/hyperpolymath/pons-asinorum \
              --rev "$PONS_SHA" --locked --force --root "$HOME/.pons" pons-cli
          fi
          "$BIN" --version

      - name: Run pons-asinorum scan
        id: scan
        run: |
          set -euo pipefail
          set +e
          "$HOME/.pons/bin/pons" scan --format json . > pons-report.json
          PONS_EXIT=$?
          set -e
          if [ "$PONS_EXIT" -ne 0 ] && [ "$PONS_EXIT" -ne 1 ]; then
            echo "::error::pons-asinorum failed with exit ${PONS_EXIT}"
            exit "$PONS_EXIT"
          fi
          jq '[.findings[]? | {
                 file:     (.file // null),
                 line:     (.line // null),
                 severity: ((.severity // .tier // "low") | tostring | ascii_downcase),
                 message:  (.message // .title // "pons-asinorum finding"),
                 category: (.rule // .code // "pons-asinorum")
               }]' pons-report.json > pons-findings.json

          TOTAL=$(jq '. | length' pons-findings.json)
          CRITICAL=$(jq '[.[] | select(.severity == "critical")] | length' pons-findings.json)
          HIGH=$(jq '[.[] | select(.severity == "high")] | length' pons-findings.json)
          MEDIUM=$(jq '[.[] | select(.severity == "medium")] | length' pons-findings.json)
          LOW=$(jq '[.[] | select(.severity == "low")] | length' pons-findings.json)

          {
            echo "total=$TOTAL"
            echo "critical=$CRITICAL"
            echo "high=$HIGH"
            echo "medium=$MEDIUM"
            echo "low=$LOW"
          } >> "$GITHUB_OUTPUT"

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## pons-asinorum Scan Results

          | Severity | Count |
          |----------|-------|
          | Critical | $CRITICAL |
          | High     | $HIGH |
          | Medium   | $MEDIUM |
          | Low      | $LOW |
          | **Total**| $TOTAL |
          EOF

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error::pons-asinorum found $CRITICAL critical issue(s) — blocking merge"
            exit 1
          fi

      - name: Upload pons-asinorum findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pons-findings
          path: |
            pons-findings.json
            pons-report.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Job 4: patch-bridge triage (RustSec CVE contextual assessment via cargo-audit)
  # ---------------------------------------------------------------------------
  patch-bridge-triage:
    name: Patch Bridge CVE triage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock files against RustSec advisory database
        run: |
          set -euo pipefail
          mkdir -p reports "$RUNNER_TEMP/audit"
          echo "[]" > "$RUNNER_TEMP/audit/cves.json"
          MITIGATED=0
          UNMITIGABLE=0
          INFORMATIONAL=0

          AUDITED_COUNT=0
          while IFS= read -r -d '' lockfile; do
            OUT="$RUNNER_TEMP/audit/one.json"
            ERR="$RUNNER_TEMP/audit/err.log"
            set +e
            cargo audit --json -f "$lockfile" > "$OUT" 2> "$ERR"
            AUDIT_RC=$?
            set -e
            if ! jq -e '.database and .vulnerabilities' "$OUT" >/dev/null 2>&1; then
              echo "::error::cargo-audit failed to produce valid JSON report for $lockfile (rc=$AUDIT_RC)"
              if [ -f "$ERR" ]; then
                cat "$ERR" >&2
              fi
              exit 1
            fi
            AUDITED_COUNT=$((AUDITED_COUNT + 1))
            V_MIT=$(jq '[.vulnerabilities.list[]? | select((.versions.patched | length) > 0)] | length' "$OUT")
            V_UNM=$(jq '[.vulnerabilities.list[]? | select((.versions.patched | length) == 0)] | length' "$OUT")
            W_INF=$(jq '[.warnings[]?[]?] | length' "$OUT")
            MITIGATED=$((MITIGATED + V_MIT))
            UNMITIGABLE=$((UNMITIGABLE + V_UNM))
            INFORMATIONAL=$((INFORMATIONAL + W_INF))
            jq --arg lf "$lockfile" \
              '[.vulnerabilities.list[]? | {lockfile: $lf, id: .advisory.id, package: .package.name, version: .package.version, patched: .versions.patched}]' \
              "$OUT" > "$RUNNER_TEMP/audit/add.json"
            jq -s '.[0] + .[1]' "$RUNNER_TEMP/audit/cves.json" "$RUNNER_TEMP/audit/add.json" \
              > "$RUNNER_TEMP/audit/next.json"
            mv "$RUNNER_TEMP/audit/next.json" "$RUNNER_TEMP/audit/cves.json"
          done < <(find src tools -name Cargo.lock -print0 | sort -z)

          if [ "$AUDITED_COUNT" -eq 0 ]; then
            echo "::error::No Cargo.lock files were audited"
            exit 1
          fi

          jq -n \
            --arg status "completed" \
            --arg scanner "cargo-audit" \
            --slurpfile cves "$RUNNER_TEMP/audit/cves.json" \
            --argjson mitigated "$MITIGATED" \
            --argjson unmitigable "$UNMITIGABLE" \
            --argjson informational "$INFORMATIONAL" \
            '{
              status: $status,
              scanner: $scanner,
              cves: $cves[0],
              mitigated: $mitigated,
              unmitigable: $unmitigable,
              concatenative: 0,
              informational: $informational
            }' > reports/bridge-report.json

          {
            echo "## Patch Bridge CVE Triage (\`cargo-audit\`)"
            echo ""
            echo "- **Upgrade-mitigable advisories:** $MITIGATED"
            echo "- **Unmitigable advisories:** $UNMITIGABLE"
            echo "- **Informational warnings:** $INFORMATIONAL"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$UNMITIGABLE" -gt 0 ]; then
            echo "::error::cargo-audit detected $UNMITIGABLE unpatched vulnerability advisory/advisories"
            exit 1
          fi

      - name: Upload bridge report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-report
          path: reports/bridge-report.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Job 5: deposit-findings (combines + archives for gitbot-fleet)
  # ---------------------------------------------------------------------------
  deposit-findings:
    name: Deposit findings for gitbot-fleet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [panic-attack-assail, hypatia-scan, pons-asinorum-scan, patch-bridge-triage]
    if: always()
    steps:
      - name: Download panic-attack findings
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: panic-attack-findings
          path: findings/

      - name: Download hypatia findings
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hypatia-findings
          path: findings/

      - name: Download pons-asinorum findings
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pons-findings
          path: findings/

      - name: Download bridge report
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-report
          path: findings/

      - name: Combine findings into unified report
        id: combine
        run: |
          set -euo pipefail
          mkdir -p findings
          PA_FILE="findings/panic-attack-findings.json"
          HYP_FILE="findings/hypatia-findings.json"
          PONS_FILE="findings/pons-findings.json"

          for f in "$PA_FILE" "$HYP_FILE" "$PONS_FILE"; do
            if [ ! -s "$f" ] || ! jq empty "$f" 2>/dev/null; then
              echo "[]" > "$f"
            fi
          done

          jq '[.[] | . + {"scanner": "panic-attack"}]' "$PA_FILE"   > "$RUNNER_TEMP/pa-tagged.json"
          jq '[.[] | . + {"scanner": "hypatia"}]'      "$HYP_FILE"  > "$RUNNER_TEMP/hyp-tagged.json"
          jq '[.[] | . + {"scanner": "pons-asinorum"}]' "$PONS_FILE" > "$RUNNER_TEMP/pons-tagged.json"

          BRIDGE_FILE="findings/bridge-report.json"
          if [ ! -s "$BRIDGE_FILE" ] || ! jq empty "$BRIDGE_FILE" 2>/dev/null; then
            echo '{"status":"not_run","reason":"bridge-report artifact absent","cves":[],"mitigated":null,"unmitigable":null,"concatenative":null,"informational":null}' > "$BRIDGE_FILE"
            echo "::warning::bridge-report artifact was absent or invalid; recorded as not_run rather than as a clean triage"
          fi

          jq -n \
            --arg repo   "${{ github.repository }}" \
            --arg sha    "${{ github.sha }}" \
            --arg ref    "${{ github.ref }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg ts     "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile pa     "$RUNNER_TEMP/pa-tagged.json" \
            --slurpfile hyp    "$RUNNER_TEMP/hyp-tagged.json" \
            --slurpfile pons   "$RUNNER_TEMP/pons-tagged.json" \
            --slurpfile bridge "$BRIDGE_FILE" \
            '{
              schema_version: "1.2.0",
              repository: $repo,
              commit_sha: $sha,
              ref: $ref,
              run_id: $run_id,
              timestamp: $ts,
              findings: ($pa[0] + $hyp[0] + $pons[0]),
              patch_bridge: $bridge[0]
            }' > findings/unified-findings.json

          TOTAL=$(jq '.findings | length' findings/unified-findings.json)
          CRITICAL=$(jq '[.findings[] | select(.severity == "critical")] | length' findings/unified-findings.json)
          HIGH=$(jq '[.findings[] | select(.severity == "high")] | length' findings/unified-findings.json)
          MEDIUM=$(jq '[.findings[] | select(.severity == "medium")] | length' findings/unified-findings.json)
          LOW=$(jq '[.findings[] | select(.severity == "low")] | length' findings/unified-findings.json)

          echo "total=$TOTAL"       >> "$GITHUB_OUTPUT"
          echo "critical=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high=$HIGH"         >> "$GITHUB_OUTPUT"
          echo "medium=$MEDIUM"     >> "$GITHUB_OUTPUT"
          echo "low=$LOW"           >> "$GITHUB_OUTPUT"

      - name: Upload unified findings (fleet scanner picks these up)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unified-findings
          path: findings/unified-findings.json
          retention-days: 90

      - name: Write deposit summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Unified Findings Deposit

          **Repository:** ${{ github.repository }}
          **Commit:** \`${{ github.sha }}\`
          **Deposited at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          | Severity | Count |
          |----------|-------|
          | Critical | ${{ steps.combine.outputs.critical }} |
          | High     | ${{ steps.combine.outputs.high }} |
          | Medium   | ${{ steps.combine.outputs.medium }} |
          | Low      | ${{ steps.combine.outputs.low }} |
          | **Total**| ${{ steps.combine.outputs.total }} |

          Findings saved as \`unified-findings\` artifact.
          The gitbot-fleet scanner will ingest these on its next pass.
          EOF
