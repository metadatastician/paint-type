[package]
name = "paint-type-plugins"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Plugin system for paint.type - WASM sandbox, manifest, effect/tool APIs"

[dependencies]
paint_core = { path = "../paint_core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[features]
default = []
ml-dsa = []  # ML-DSA signing (requires proven-pqc integration)
