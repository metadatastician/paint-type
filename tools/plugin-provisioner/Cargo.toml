[package]
name = "paint-type-plugin-provisioner"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Plugin provisioner tool for paint.type - deploys plugins and sets up runtime environment"

[[bin]]
name = "plugin-provisioner"
path = "src/main.rs"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# File operations
walkdir = "2"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Hashing for integrity checks
sha2 = "0.10"
hex = "0.4"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []
network = []

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
