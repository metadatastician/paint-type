[package]
name = "plugin-wizard"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Interactive CLI wizard for scaffolding paint.type plugins"

[[bin]]
name = "plugin-wizard"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Interactive prompts
dialoguer = "0.11"
console = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"

# File operations
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = "s"
strip = true
